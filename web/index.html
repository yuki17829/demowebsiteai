<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapheal - Trợ lý ảo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Thanh menu trên cùng: luôn hiện, có nút mở Thư viện Tool -->
<header class="main-nav">
  <div class="main-nav-brand">
    <span class="status-dot"></span>
    <span class="main-nav-name">Rapheal</span>
  </div>
  <a class="main-nav-tool-btn" href="tool.html">
    <span class="tdi-ico">🧰</span> Thư viện Tool
  </a>
</header>

<div class="core-wrapper" aria-hidden="true">
  <!-- Trường mạch nền: vòng tròn mờ + tia toả -->
  <div class="circuit-field"></div>

  <!-- Vòng chỉ số dạng đồng hồ đo -->
  <div class="ring ring-dial"></div>

  <!-- Vòng ký tự / dấu khắc -->
  <div class="ring ring-glyph"></div>

  <!-- Vòng xoay chính -->
  <div class="ring ring-outer"></div>
  <div class="ring ring-mid"></div>
  <div class="ring ring-inner"></div>

  <!-- Hạt bay xung quanh -->
  <canvas id="particles"></canvas>

  <!-- Lõi trung tâm -->
  <div class="core">
    <div class="core-glow"></div>
    <div class="core-burst"></div>
    <div class="core-center"></div>
  </div>
</div>

<!-- Cụm chat: tab công cụ (trái) + khay công cụ + khung chat -->
<div class="chat-cluster" id="chatCluster">

  <!-- Gốc/Tab công cụ gắn bên trái khung chat -->
  <button class="tool-tab" id="toolTab" aria-label="Mở bảng công cụ" aria-expanded="false" title="Công cụ">
    <span class="tool-tab-icon">⚙</span>
    <span class="tool-tab-text">TOOL</span>
  </button>

  <!-- Khay mở rộng công cụ -->
  <div class="tool-drawer" id="toolDrawer">
    <div class="tool-drawer-head">Công cụ nhanh</div>
    <button class="tool-drawer-item" data-cmd="/status">
      <span class="tdi-ico">◈</span> Trạng thái hệ thống
    </button>
    <button class="tool-drawer-item" data-cmd="/clear">
      <span class="tdi-ico">✦</span> Xoá lịch sử chat
    </button>
    <a class="tool-drawer-item tool-drawer-link" href="tool.html">
      <span class="tdi-ico">⇲</span> Mở Thư viện Tool
    </a>
  </div>

  <!-- Khung chat -->
  <div class="chat-box" id="chatBox">
    <div class="chat-header">
      <div class="chat-header-id">
        <span class="status-dot"></span>
        <span class="chat-title">Rapheal</span>
        <span class="chat-subtitle">trợ lý hệ thống</span>
      </div>
      <div class="chat-header-actions">
        <button class="chat-btn" id="shrinkBtn" title="Thu nhỏ khung">−</button>
        <button class="chat-btn" id="growBtn" title="Phóng to khung">+</button>
        <button class="chat-btn" id="hideBtn" title="Ẩn khung chat">✕</button>
      </div>
    </div>

    <div class="chat-log" id="chatLog">
      <div class="msg bot">Rapheal đã sẵn sàng. Sếp cần gì?</div>
    </div>

    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Nhập lệnh cho Rapheal..." autocomplete="off">
      <button id="sendBtn">Gửi</button>
    </div>

    <div class="resize-handle" id="resizeHandle" title="Kéo để đổi kích thước"></div>
  </div>
</div>


<!-- Nút nổi để mở lại chat khi đã ẩn -->
<button class="chat-restore" id="chatRestore" aria-label="Mở lại Rapheal">
  <span class="restore-dot"></span>
</button>

<script src="script.js"></script>
</body>
</html>
